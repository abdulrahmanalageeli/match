name: Wudayn iPhone simulator
on:
  workflow_dispatch:
    inputs:
      scenario:
        type: choice
        options: [smoke, lifecycle]
        default: smoke
        description: Suite to run
  push:
    branches: [codex/wudayn-ios-simulator]
permissions:
  contents: read
concurrency:
  group: ios-simulator-${{ github.ref }}-${{ inputs.scenario == 'lifecycle' || contains(github.event.head_commit.message, '[lifecycle]') }}
  cancel-in-progress: false
jobs:
  simulator:
    if: (github.event_name == 'workflow_dispatch' && inputs.scenario != 'lifecycle') || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[lifecycle]'))
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        working-directory: iphone
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select and boot an installed iPhone
        run: |
          xcodebuild -version
          udid=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; groups=json.load(sys.stdin)["devices"]; phones=[d for k,ds in groups.items() if ".iOS-" in k for d in ds if d["name"].startswith("iPhone")]; print(next((d["udid"] for d in phones if d["name"].endswith(" Pro")), phones[0]["udid"]))')
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
      - name: Build member app and bundle offline test pages
        run: |
          npm ci
          npm run build
          node tests/simulator/build-fixtures.mjs
          npx --no-install cap sync ios
      - name: Configure hosted XCTest in the runner checkout
        run: |
          gem list -i xcodeproj || gem install --user-install xcodeproj -v 1.27.0 --no-document
          ruby tests/simulator/add-test-target.rb
      - name: Build, install and exercise Wudayn on iPhone
        run: |
          mkdir -p "$RUNNER_TEMP/wudayn-results"
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcrun simctl list devices booted
          set -o pipefail
          xcodebuild test -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/WudaynBuild" \
            -resultBundlePath "$RUNNER_TEMP/wudayn-results/Wudayn.xcresult" \
            | tee "$RUNNER_TEMP/wudayn-results/xcodebuild.log"
      - name: Save native test results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wudayn-simulator-results
          path: ${{ runner.temp }}/wudayn-results
          retention-days: 7
  lifecycle:
    if: inputs.scenario == 'lifecycle' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[lifecycle]'))
    runs-on: macos-26
    timeout-minutes: 55
    defaults:
      run:
        working-directory: product/iphone
    env:
      VITE_MARRIAGE_ENV: staging
    steps:
      - name: Check out simulator harness
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out current member application
        uses: actions/checkout@v4
        with:
          ref: main
          path: product
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Boot iPhone and record app revision
        run: |
          mkdir -p "$RUNNER_TEMP/lifecycle-results" tests/simulator
          git rev-parse HEAD | tee "$RUNNER_TEMP/lifecycle-results/app-revision.txt"
          xcodebuild -version | tee "$RUNNER_TEMP/lifecycle-results/xcode.txt"
          udid=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=[d for k,items in json.load(sys.stdin)["devices"].items() if ".iOS-" in k for d in items if d["name"].startswith("iPhone")]; print(next((d["udid"] for d in devices if d["name"].endswith(" Pro")),devices[0]["udid"]))')
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          cp "$GITHUB_WORKSPACE"/iphone/tests/simulator/lifecycle* tests/simulator/
          cp "$GITHUB_WORKSPACE"/iphone/tests/simulator/{add-test-target.rb,build-relationship.mjs} tests/simulator/
          cp tests/simulator/lifecycle-checks.swift tests/simulator/SimulatorChecks.swift
      - name: Bundle member app and isolated fixture pages
        run: |
          npm ci --no-audit
          npm ci --prefix supabase/tests --no-audit
          npm run build
          node tests/simulator/lifecycle-signup-build.mjs dist/simulator-tests
          node tests/simulator/build-relationship.mjs
          test -f dist/simulator-tests/tests/simulator/lifecycle-signup.html
          test -f dist/simulator-tests/tests/simulator/lifecycle-relationship.html
          npx --no-install cap sync ios
          gem list -i xcodeproj || gem install --user-install xcodeproj -v 1.27.0 --no-document
          ruby tests/simulator/add-test-target.rb
      - name: Exercise both member journeys inside Wudayn
        run: |
          set -o pipefail
          results="$RUNNER_TEMP/lifecycle-results"
          node --experimental-strip-types --experimental-vm-modules tests/simulator/lifecycle-backend.mjs > "$results/backend.log" 2>&1 &
          server=$!
          trap 'curl -fsS --max-time 15 http://127.0.0.1:18767/results > "$results/lifecycle.json" || true; kill "$server" || true' EXIT
          curl --retry 20 --retry-delay 1 --retry-connrefused -fsS http://127.0.0.1:18767/health
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcrun simctl list devices booted | tee "$results/device.txt"
          xcodebuild test -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" -parallel-testing-enabled NO \
            -only-testing:SimulatorChecks/SimulatorChecks/testTwoMemberLifecycle \
            -derivedDataPath "$RUNNER_TEMP/WudaynBuild" -resultBundlePath "$results/Lifecycle.xcresult" \
            | tee "$results/xcodebuild.log"
      - name: Save XCTest, screenshots, and database evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wudayn-two-member-lifecycle
          path: ${{ runner.temp }}/lifecycle-results
          retention-days: 7
