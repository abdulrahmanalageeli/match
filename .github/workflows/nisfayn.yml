name: Nisfayn checks
on:
  pull_request:
    paths: ['iphone/**', '.github/workflows/nisfayn.yml']
  push:
    paths: ['iphone/**', '.github/workflows/nisfayn.yml']
  workflow_dispatch:
    inputs:
      chat_privacy_diagnostic:
        description: 'Compare the isolated chat-deletion test on two PGlite versions'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: nisfayn-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && inputs.chat_privacy_diagnostic && '-chat-privacy' || '' }}
  cancel-in-progress: true
jobs:
  verify:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.chat_privacy_diagnostic }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
        working-directory: iphone
      - run: node --experimental-strip-types --experimental-vm-modules --test tests/*.test.mjs
        working-directory: iphone
      - run: npm run build
        working-directory: iphone
        env:
          VITE_MARRIAGE_ENV: demo
      - run: npm ci
        working-directory: iphone/admin
      - run: npm test
        working-directory: iphone/admin
      - run: npm run build
        working-directory: iphone/admin
        env:
          VITE_ADMIN_MODE: demo
      - run: npm ci
        working-directory: iphone/supabase/tests
      - run: npm test
        working-directory: iphone/supabase/tests

  chat-privacy-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.chat_privacy_diagnostic }}
    name: Chat privacy / PGlite ${{ matrix.pglite }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        pglite: ['0.3.14', '0.4.6']
    permissions:
      contents: read
    defaults:
      run:
        working-directory: member/iphone/supabase/tests
    steps:
      - name: Check out the QA diagnostic
        uses: actions/checkout@v7
        with:
          path: diagnostic
          persist-credentials: false
          sparse-checkout: .github/diagnostics
      - name: Check out the exact member revision tested on main
        uses: actions/checkout@v7
        with:
          ref: f81d5c63cd1416561f9d2b99dcd1fcd477b8f0a4
          path: member
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.5'
          package-manager-cache: false
      - run: npm ci
      - name: Install comparison version in the disposable checkout
        if: ${{ matrix.pglite == '0.4.6' }}
        run: npm install --no-save --ignore-scripts --package-lock=false --no-audit --no-fund @electric-sql/pglite@0.4.6
      - name: Verify revision and runtime
        env:
          EXPECTED_PGLITE: ${{ matrix.pglite }}
        run: |
          git rev-parse HEAD
          node --version
          version=$(node -p "require('./node_modules/@electric-sql/pglite/package.json').version")
          echo "PGlite $version"
          test "$version" = "$EXPECTED_PGLITE"
      - name: Run the original four chat privacy tests
        id: baseline
        run: node --experimental-strip-types --test chat-privacy.test.mjs
      - name: Run the same file with separate query, assertion and teardown diagnostics
        if: ${{ !cancelled() && (steps.baseline.outcome == 'success' || steps.baseline.outcome == 'failure') }}
        run: |
          node "$GITHUB_WORKSPACE/diagnostic/.github/diagnostics/chat-privacy.mjs"
          node --experimental-strip-types --test .chat-privacy-diagnostic.mjs
