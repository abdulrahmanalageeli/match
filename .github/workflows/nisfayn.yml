name: Nisfayn checks
on:
  pull_request:
    paths: ['iphone/**', '.github/workflows/nisfayn.yml']
  push:
    paths: ['iphone/**', '.github/workflows/nisfayn.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nisfayn-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
        working-directory: iphone
      - run: node --experimental-strip-types --experimental-vm-modules --test tests/*.test.mjs
        working-directory: iphone
      - run: npm run build
        working-directory: iphone
        env:
          VITE_MARRIAGE_ENV: demo
      - run: npm ci
        working-directory: iphone/admin
      - run: npm test
        working-directory: iphone/admin
      - run: npm run build
        working-directory: iphone/admin
        env:
          VITE_ADMIN_MODE: demo
      - run: npm ci
        working-directory: iphone/supabase/tests
      - run: npm test
        working-directory: iphone/supabase/tests

      - name: Install pinned browser runner
        run: |
          npm install --prefix "$RUNNER_TEMP/wudayn-browser" --ignore-scripts --no-audit --no-fund --no-package-lock playwright-core@1.56.1
          "$RUNNER_TEMP/wudayn-browser/node_modules/.bin/playwright-core" install --with-deps chromium
      - name: Verify the owner and member workflows
        working-directory: iphone
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/wudayn-browser/node_modules/playwright-core
          WUDAYN_BROWSER_CHANNEL: chromium
          PLAYWRIGHT_CHANNEL: chromium
        run: |
          node tests/launch-console.browser.mjs
          node --experimental-strip-types tests/conduct-admin-member.browser.mjs
          node tests/release-gate.browser.mjs
          node tests/membership-gifts.browser.mjs
