workflows:
  nisfayn-testflight:
    name: Nisfayn · iPhone TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45
    # Manual runs only: do not spend build minutes on every website commit.
    integrations:
      app_store_connect: nisfayn-apple
    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.blindmatch.marriage
      vars:
        VITE_MARRIAGE_ENV: production
    scripts:
      - name: Install locked frontend dependencies
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/iphone"
          npm ci
      - name: Build and sync the iPhone app
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/iphone"
          npm run build
          npx cap sync ios
      - name: Resolve native Swift packages
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/iphone/ios/App"
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App
      - name: Assign a unique build number
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/iphone/ios/App"
          agvtool new-version -all "$((PROJECT_BUILD_NUMBER + 1))"
      - name: Apply Apple distribution signing
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/iphone/ios/App"
          xcode-project use-profiles
      - name: Archive the signed iPhone app
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/iphone/ios/App"
          xcode-project build-ipa --project App.xcodeproj --scheme App
    artifacts:
      - iphone/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Upload for internal testing first. Invite external testers in Apple
        # after completing beta information and reviewing the first build.
        submit_to_testflight: false
        submit_to_app_store: false
