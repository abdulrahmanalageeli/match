workflows:
  nisfayn-testflight:
    name: Nisfayn · iPhone TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45
    # Manual runs only: do not spend build minutes on every website commit.
    integrations:
      app_store_connect: Nisfayn Codemagic
    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.blindmatch.marriage
      vars:
        VITE_MARRIAGE_PUSH_ENABLED: "true"
    scripts:
      - name: Install locked frontend dependencies
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/iphone"
          npm ci
      - name: Build and sync the iPhone app
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/iphone"
          node scripts/check-ios-icons.mjs
          export VITE_MARRIAGE_ENV="${VITE_MARRIAGE_ENV:-production}"
          node --experimental-strip-types scripts/configure-ios-receipts.mjs
          npm run build
          npx cap sync ios
      - name: Resolve native Swift packages
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/iphone/ios/App"
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App
      - name: Assign a unique build number
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/iphone/ios/App"
          agvtool new-version -all "$((PROJECT_BUILD_NUMBER + 1))"
      - name: Apply Apple distribution signing
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/iphone/ios/App"
          xcode-project use-profiles
      - name: Archive the signed iPhone app
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/iphone/ios/App"
          xcode-project build-ipa --project App.xcodeproj --scheme App
          # Both targets need their own distribution profile in the signed archive.
          python3 - <<'PY'
          from pathlib import Path
          from plistlib import loads
          from zipfile import ZipFile
          ipa, = Path("build/ios/ipa").glob("*.ipa")
          with ZipFile(ipa) as archive:
              app, = (name for name in archive.namelist() if name.startswith("Payload/") and name.endswith(".app/Info.plist") and name.count("/") == 2)
              extension = app.removesuffix("Info.plist") + "PlugIns/MessageReceipt.appex/"
              host, receipt = loads(archive.read(app)), loads(archive.read(extension + "Info.plist"))
              assert archive.read(extension + "embedded.mobileprovision") and archive.read(extension + "_CodeSignature/CodeResources")
              assert receipt["CFBundleVersion"] == host["CFBundleVersion"]
              assert receipt["CFBundleIdentifier"] == host["CFBundleIdentifier"] + ".MessageReceipt"
              assert receipt["ReceiptURL"].startswith("https://") and receipt["ReceiptPublicKey"].startswith("sb_publishable_")
          PY
    artifacts:
      - iphone/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Upload for internal testing first. Invite external testers in Apple
        # after completing beta information and reviewing the first build.
        submit_to_testflight: false
        submit_to_app_store: false
