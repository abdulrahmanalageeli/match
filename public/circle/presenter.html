<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>THE CIRCLE — العرض المباشر</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="presenter.css"><script type="module" src="presenter.js"></script></head><body>
<main id="stage" class="stage"><img id="original-slide" alt="" draggable="false"></main>
<div id="timer" class="timer" hidden><button id="timer-toggle" class="timer-button" aria-label="أدوات المؤقت" aria-expanded="false"><span>◷</span><output id="clock">3:00</output></button><div id="timer-tools" class="timer-tools" hidden><button id="pause">إيقاف</button><button id="restart">↻</button><button id="add">+30</button></div></div>
<div class="presenter-menu"><button id="menu-toggle" aria-label="أدوات العرض" aria-expanded="false">⋯</button><div id="menu" hidden><div class="nav"><button id="prev" aria-label="السابق">←</button><span id="page-number"></span><button id="next" aria-label="التالي">→</button></div><select id="jump" aria-label="انتقل إلى شريحة"></select><div class="menu-actions"><button id="fullscreen">ملء الشاشة</button><a href="host.html" target="_blank" rel="noopener">المشاركات المجهولة ↗</a></div><p>← → تنقّل · Space إيقاف · R إعادة · T +30 · F ملء الشاشة</p></div></div>

<dialog id="anonymous-dialog" aria-labelledby="anonymous-title"><header class="anonymous-header"><span class="join-brand">THE CIRCLE</span><button id="anonymous-close" aria-label="رجوع للعرض">رجوع للعرض ×</button></header><p class="anonymous-kicker">مشاركات من الدائرة · بدون أسماء</p><h2 id="anonymous-title">الديل بريكرز المكتوبة.</h2><div id="anonymous-cards" class="anonymous-cards"></div><footer class="anonymous-pagination"><button id="anonymous-prev" aria-label="المشاركات السابقة">→</button><span id="anonymous-page"></span><button id="anonymous-next" aria-label="المشاركات التالية">←</button></footer></dialog>
