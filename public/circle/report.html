<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#281c16">
  <meta name="robots" content="noindex,nofollow"><title>المشاركات المجهولة — The Circle</title>
  <link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./host.css">
  <style id="report-extra-style">.report-toolbar{flex-wrap:wrap}.report-toolbar button{min-height:46px}.report-toolbar .primary-report{background:#f7f0e5;color:#322219;border-color:#f7f0e5}.report-cover .report-subtitle{color:#806b5c;font-size:19px;line-height:1.8}.report-date{color:#806b5c;font-size:14px}.report-section-title{font-size:27px;margin:44px 0 17px}.report-card .result-names{white-space:pre-wrap}.report-stats{flex-wrap:wrap;gap:22px 34px}.report-privacy{margin-top:30px;padding-top:18px;border-top:1px solid #d9c7b6;color:#806b5c;font-size:13px}.report-loading{text-align:center;color:#c7ad96;padding:70px 10px}.report-total{font-size:13px;color:#806b5c;margin:0 0 18px}.report-anonymous{white-space:pre-wrap;overflow-wrap:anywhere;border-top:1px solid #d9c7b6;padding:18px 0;margin:0;line-height:1.85}.report-anonymous:first-of-type{border-top:0}.report-ledger summary{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.report-ledger .ledger{margin-top:15px}.report-ledger .ledger td{overflow-wrap:anywhere}.report-access{max-width:640px;margin:45px auto}.report-access a{text-decoration:underline;color:#a35237}.report-name{overflow-wrap:anywhere}.inactive-note{font-size:12px;color:#92705a;font-weight:400}.export-actions{display:flex;justify-content:center;padding:24px}.export-actions button{background:#f7f0e5;color:#322219}.report-offline-note{text-align:center;color:#c7ad96;font-size:13px}@media print{.report-section-title{color:#322219;break-after:avoid}.export-actions,.report-offline-note{display:none!important}.report-stats{gap:30px}.report-privacy{color:#806b5c}.report-anonymous{break-inside:avoid}}</style>
  <script src="./report.js" type="module"></script>
</head>
<body><div class="host-shell">
  <header class="host-header"><a class="wordmark" href="./host.html" dir="ltr">THE CIRCLE</a><span>المشاركات المجهولة</span><a href="./host.html">لوحة المنظّم ←</a></header>
  <div id="report-toolbar" class="report-toolbar" hidden><button id="print-report" class="primary-report" type="button">طباعة / حفظ PDF</button><button id="download-report" type="button">تنزيل نسخة HTML كاملة</button><button id="refresh-report" type="button">تحديث التقرير</button></div>
  <p id="report-loading" class="report-loading" role="status">نجهّز تقرير اللقاء…</p>
  <section id="report-access" class="panel report-access" hidden><h1>التقرير خاص بالمنظّم</h1><p>سجّل الدخول من لوحة المنظّم، ثم ارجع هنا لعرض التقرير.</p><a href="./host.html">افتح لوحة المنظّم</a></section>
  <p id="error" class="form-error" role="alert" hidden></p>
  <button id="retry-report" type="button" hidden>حاول مرّة ثانية</button>
  <main id="report-sheet" class="report-sheet"></main>
  <p id="report-note" class="report-note" hidden>نسخة خاصة بالمنظّم. جميع المشاركات مكتوبة بدون أسماء.</p>
</div></body></html>
